<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1550" viewBox="0 0 2000 1550" role="img" aria-labelledby="title desc">
  <title id="title">CampusCare App-2 Data Flow Diagram, Level 1</title>
  <desc id="desc">Level 1 data flow diagram for CampusCare App-2 and the connected clinic workflows. It shows the Patient, Nurse, Physician, Dentist, and Administrator; seven processes; seven Supabase data stores; and report data flows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#465B74"/>
    </marker>
    <style>
      .ink { fill: #182B40; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #63758A; font-family: Inter, Arial, sans-serif; }
      .label { fill: #344A62; font: 500 13px Inter, Arial, sans-serif; }
      .tiny { fill: #738399; font: 11px Inter, Arial, sans-serif; }
      .flow { fill: none; stroke: #60758D; stroke-width: 1.7; marker-end: url(#arrow); }
      .actor { fill: #FFFFFF; stroke: #8FA0B4; stroke-width: 1.5; }
      .actor-name { fill: #1B3047; font: 700 14px Inter, Arial, sans-serif; letter-spacing: .9px; }
      .process { fill: #F1F5FA; stroke: #536A84; stroke-width: 1.7; }
      .process-no { fill: #DDE6F0; stroke: #536A84; stroke-width: 1.3; }
      .store { fill: #FFFFFF; stroke: #647990; stroke-width: 1.5; }
      .back { fill: #F7F9FC; }
    </style>
  </defs>

  <rect width="2000" height="1550" fill="#F7F9FC"/>
