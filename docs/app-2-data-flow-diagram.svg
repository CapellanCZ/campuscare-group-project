  <text x="70" y="123" class="ink" font-size="34" font-weight="750">CampusCare App-2 Data Flow Diagram</text>
  <text x="70" y="157" class="muted" font-size="17">Patient mobile app with connected clinic intake, care, and administration workflows</text>
  <line x1="70" y1="184" x2="1930" y2="184" stroke="#DDE4EC" stroke-width="1.5"/>

  <!-- 1.0 Account & Profile Management -->
