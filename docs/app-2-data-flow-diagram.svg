  <text x="165" y="274" text-anchor="middle" class="actor-name">PATIENT</text>
  <text x="165" y="297" text-anchor="middle" class="tiny">App account holder</text>
  <rect x="480" y="220" width="310" height="120" rx="9" class="process"/>
  <rect x="490" y="230" width="54" height="25" rx="3" class="process-no"/>
  <text x="517" y="248" text-anchor="middle" class="ink" font-size="12" font-weight="700">1.0</text>
  <text x="635" y="272" text-anchor="middle" class="ink" font-size="17" font-weight="700">Account &amp; Profile</text>
  <text x="635" y="296" text-anchor="middle" class="ink" font-size="17" font-weight="700">Management</text>
  <rect x="1020" y="235" width="380" height="90" rx="3" class="store"/>
  <rect x="1020" y="235" width="48" height="90" fill="#EAF0F7" stroke="#647990" stroke-width="1.5"/>
  <text x="1044" y="284" text-anchor="middle" class="ink" font-size="14" font-weight="700">D1</text>
  <text x="1082" y="271" class="ink" font-size="14" font-weight="700">User Accounts &amp; Patient Profiles</text>
  <text x="1082" y="295" class="tiny">users · patients</text>
  <path d="M270 256 H480" class="flow"/>
  <rect x="284" y="238" width="180" height="23" rx="3" class="back"/>
  <text x="292" y="255" class="label">Sign-in / profile details</text>
  <path d="M480 303 H270" class="flow"/>
  <rect x="286" y="285" width="176" height="23" rx="3" class="back"/>
