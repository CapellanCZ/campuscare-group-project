<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">CampusCare App-2 Context Level Diagram</title>
  <desc id="desc">Context diagram for the CampusCare patient mobile application and its data exchanges with the Patient, Nurse, Physician, Dentist, and Administrator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#465B74"/>
    </marker>
    <style>
      .ink { fill: #182B40; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #63758A; font-family: Inter, Arial, sans-serif; }
      .flow { fill: #344A62; font: 500 15px Inter, Arial, sans-serif; }
      .flowline { fill: none; stroke: #60758D; stroke-width: 1.8; marker-end: url(#arrow); }
      .actor { fill: #FFFFFF; stroke: #9BAABD; stroke-width: 1.7; }
      .actor-label { fill: #1B3047; font: 700 18px Inter, Arial, sans-serif; letter-spacing: 1px; }
      .actor-sub { fill: #718196; font: 13px Inter, Arial, sans-serif; }
      .label-bg { fill: #F7F9FC; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#F7F9FC"/>
  <text x="70" y="72" class="muted" font-size="14" font-weight="700" letter-spacing="2.2">4.2.1  SYSTEM CONTEXT</text>
  <text x="70" y="123" class="ink" font-size="34" font-weight="750">CampusCare App-2 Context Level Diagram</text>
  <text x="70" y="157" class="muted" font-size="17">Patient mobile app and connected Health Service workflows</text>
  <line x1="70" y1="184" x2="1730" y2="184" stroke="#DDE4EC" stroke-width="1.5"/>

  <!-- External actors -->
  <rect x="72" y="440" width="250" height="118" rx="5" class="actor"/>
  <text x="197" y="490" text-anchor="middle" class="actor-label">PATIENT</text>
  <text x="197" y="518" text-anchor="middle" class="actor-sub">CampusCare mobile app user</text>

  <rect x="1480" y="230" width="250" height="118" rx="5" class="actor"/>
  <text x="1605" y="280" text-anchor="middle" class="actor-label">NURSE</text>
  <text x="1605" y="308" text-anchor="middle" class="actor-sub">Intake, triage and queue</text>

  <rect x="1480" y="430" width="250" height="118" rx="5" class="actor"/>
  <text x="1605" y="480" text-anchor="middle" class="actor-label">PHYSICIAN</text>
  <text x="1605" y="508" text-anchor="middle" class="actor-sub">General health service</text>

  <rect x="1480" y="630" width="250" height="118" rx="5" class="actor"/>
  <text x="1605" y="680" text-anchor="middle" class="actor-label">DENTIST</text>
  <text x="1605" y="708" text-anchor="middle" class="actor-sub">Dental health service</text>

  <rect x="760" y="850" width="280" height="118" rx="5" class="actor"/>
  <text x="900" y="900" text-anchor="middle" class="actor-label">ADMINISTRATOR</text>
  <text x="900" y="928" text-anchor="middle" class="actor-sub">Clinic account and system oversight</text>

  <!-- System boundary -->
  <rect x="650" y="365" width="500" height="300" rx="24" fill="#EAF0F7" stroke="#27415E" stroke-width="2.5"/>
  <rect x="690" y="398" width="420" height="234" rx="17" fill="#FFFFFF" stroke="#CCD6E2" stroke-width="1.2"/>
  <text x="900" y="456" text-anchor="middle" class="muted" font-size="13" font-weight="700" letter-spacing="2">CAMPUSCARE</text>
  <text x="900" y="496" text-anchor="middle" class="ink" font-size="25" font-weight="750">APP-2</text>
  <text x="900" y="526" text-anchor="middle" class="ink" font-size="17" font-weight="600">Patient Mobile Application</text>
  <line x1="765" y1="548" x2="1035" y2="548" stroke="#E2E8EF" stroke-width="1.2"/>
  <text x="900" y="578" text-anchor="middle" class="muted" font-size="14">Shared CampusCare health-service data</text>
  <text x="900" y="601" text-anchor="middle" class="muted" font-size="14">appointments · queue · patient records · notices</text>

  <!-- Patient -> App-2 -->
  <path d="M322 458 H650" class="flowline"/>
  <rect x="352" y="439" width="270" height="25" rx="4" class="label-bg"/>
  <text x="365" y="457" class="flow">Sign-in and profile details</text>
  <path d="M322 492 H650" class="flowline"/>
  <rect x="352" y="473" width="285" height="25" rx="4" class="label-bg"/>
  <text x="365" y="491" class="flow">Appointment request, symptoms and mood</text>
  <path d="M322 526 H650" class="flowline"/>
  <rect x="352" y="507" width="225" height="25" rx="4" class="label-bg"/>
  <text x="365" y="525" class="flow">Appointment cancellation</text>

  <!-- App-2 -> Patient -->
  <path d="M650 552 H322" class="flowline"/>
  <rect x="352" y="533" width="282" height="25" rx="4" class="label-bg"/>
  <text x="365" y="551" class="flow">Booking and queue status</text>
  <path d="M650 586 H322" class="flowline"/>
  <rect x="352" y="567" width="275" height="25" rx="4" class="label-bg"/>
  <text x="365" y="585" class="flow">Visit vitals and appointment details</text>
  <path d="M650 620 H322" class="flowline"/>
  <rect x="352" y="601" width="284" height="25" rx="4" class="label-bg"/>
  <text x="365" y="619" class="flow">Notifications and clinic announcements</text>

  <!-- Nurse -> App-2 / shared platform -->
  <path d="M1480 258 H1310 V392 H1150" class="flowline"/>
  <rect x="1167" y="232" width="285" height="25" rx="4" class="label-bg"/>
  <text x="1180" y="250" class="flow">Requests, patient intake and triage data</text>
  <path d="M1150 420 H1365 V320 H1480" class="flowline"/>
  <rect x="1172" y="393" width="267" height="25" rx="4" class="label-bg"/>
  <text x="1185" y="411" class="flow">Patient history and appointment details</text>
  <path d="M1150 446 H1405 V334 H1480" class="flowline"/>
  <rect x="1198" y="443" width="255" height="25" rx="4" class="label-bg"/>
  <text x="1211" y="461" class="flow">Vitals, queue updates and alerts</text>

  <!-- Physician <-> App-2 / shared platform -->
  <path d="M1480 461 H1150" class="flowline"/>
  <rect x="1172" y="442" width="267" height="25" rx="4" class="label-bg"/>
  <text x="1185" y="460" class="flow">Availability and consultation outcomes</text>
  <path d="M1150 493 H1480" class="flowline"/>
  <rect x="1172" y="474" width="267" height="25" rx="4" class="label-bg"/>
  <text x="1185" y="492" class="flow">Appointments and patient history</text>
  <path d="M1480 525 H1150" class="flowline"/>
  <rect x="1198" y="506" width="242" height="25" rx="4" class="label-bg"/>
  <text x="1211" y="524" class="flow">Assessment and care updates</text>

  <!-- Dentist <-> App-2 / shared platform -->
  <path d="M1480 658 H1328 V626 H1150" class="flowline"/>
  <rect x="1170" y="632" width="278" height="25" rx="4" class="label-bg"/>
  <text x="1183" y="650" class="flow">Availability and dental visit outcomes</text>
  <path d="M1150 600 H1374 V704 H1480" class="flowline"/>
  <rect x="1173" y="675" width="270" height="25" rx="4" class="label-bg"/>
  <text x="1186" y="693" class="flow">Appointments and patient history</text>
  <path d="M1480 724 H1340 V640 H1150" class="flowline"/>
  <rect x="1174" y="715" width="268" height="25" rx="4" class="label-bg"/>
  <text x="1187" y="733" class="flow">Dental assessment and care updates</text>

  <!-- Administrator <-> App-2 / shared platform -->
  <path d="M822 850 V752 H760 V665" class="flowline"/>
  <rect x="442" y="760" width="344" height="25" rx="4" class="label-bg"/>
  <text x="455" y="778" class="flow">User access, clinic settings and announcements</text>
  <path d="M1040 850 V778 H1092 V665" class="flowline"/>
  <rect x="1051" y="786" width="330" height="25" rx="4" class="label-bg"/>
  <text x="1064" y="804" class="flow">Operational reports and account activity</text>

  <!-- Legend and source note -->
  <line x1="70" y1="1017" x2="1730" y2="1017" stroke="#DDE4EC" stroke-width="1.5"/>
  <path d="M76 1053 H142" class="flowline"/>
  <text x="157" y="1058" class="muted" font-size="14">Direction of information flow</text>
  <text x="1730" y="1058" text-anchor="end" class="muted" font-size="13">Based on the CampusCare mobile app and clinic web application codebases</text>
</svg>
